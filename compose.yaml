services:
  postgres:
    image: postgres:16
    container_name: subledger_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: subledger_db
      POSTGRES_USER: subledger_user
      POSTGRES_PASSWORD: change_me
    ports:
      - "5432:5432"
    volumes:
      - subledger_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subledger_user -d subledger_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: subledger_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://subledger_user:change_me@postgres:5432/subledger_db
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  subledger_postgres_data:
